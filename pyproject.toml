[project]
name = "openbragg"
version = "0.0.0"
description = "Python-first, open-source, proton-focused treatment planning system (TPS)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Emil Brinch Holm" }]
dependencies = [
    "numpy",
    "matplotlib",
    "typer",
]

[project.scripts]
openbragg = "openbragg.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "pyright",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbragg"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
