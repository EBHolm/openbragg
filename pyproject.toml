[project]
name = "openbragg"
version = "0.0.0"
description = "Python-first, open-source, proton-focused treatment planning system (TPS)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Emil Brinch Holm" }]
dependencies = [
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbragg"]
