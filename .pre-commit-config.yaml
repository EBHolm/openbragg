# Local hooks invoke the tools through `uv run` so their versions come from
# uv.lock — pre-commit, `uv run <tool>`, and CI share one source of truth.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
